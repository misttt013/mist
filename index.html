<style>
  html, body { margin: 0; height: 100%; background: #f3f3f1; }
  @media (prefers-color-scheme: dark) { html, body { background: #0f0f0e; } }
  body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); box-sizing: border-box; font: 16px -apple-system, system-ui, sans-serif; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
  .gate { position: fixed; inset: 0; background: #c6ff00; display: grid; place-items: center; padding: 24px; }
  .gate form { width: 100%; max-width: 320px; text-align: center; }
  .gate img { width: 96px; height: 96px; border-radius: 22px; }
  .gate h1 { margin: 16px 0 6px; font-size: 28px; color: #111; }
  .gate p { margin: 0 0 18px; color: #333; }
  .gate input { width: 100%; box-sizing: border-box; padding: 14px; border-radius: 14px; border: 2px solid #111; font-size: 17px; background: #fff; color: #111; }
  .gate button { width: 100%; margin-top: 10px; padding: 14px; border-radius: 14px; border: 0; background: #111; color: #c6ff00; font-size: 17px; font-weight: 700; }
</style>
</head>
<body>
<script>
  var APP = 'https://script.google.com/macros/s/AKfycbxJIYeWdT81BLASy43NE2pJT16FIXjJyswVVbB36AkSmkoGAgje_qk4Xk_6-c_OShA0/exec';
  function get() { try { return localStorage.getItem('mistKey') || ''; } catch (e) { return ''; } }
  function put(k) { try { localStorage.setItem('mistKey', k); } catch (e) {} }
  var m = location.hash.match(/k=([^&]+)/);
  var key = m ? decodeURIComponent(m[1]) : get();
  if (m) put(key);
  if (key) {
    var f = document.createElement('iframe');
    f.src = APP + '?key=' + encodeURIComponent(key);
    f.title = 'Mist';
    document.body.appendChild(f);
  } else {
    document.body.innerHTML = '<div class="gate"><form id="g"><img src="' + document.querySelector('link[rel=apple-touch-icon]').href + '" alt="">' +
      '<h1>Mist</h1><p>Enter your key once to unlock.</p><input id="k" autocomplete="off" autocapitalize="off" placeholder="Your key"><button>Open</button></form></div>';
    document.getElementById('g').onsubmit = function (e) { e.preventDefault(); var v = document.getElementById('k').value.trim(); if (v) { put(v); location.replace(location.pathname + '#k=' + encodeURIComponent(v)); location.reload(); } };
  }
</script>
</body>
