<style>
  /* On some iOS versions a Home Screen web app loses a strip at the bottom that the page can't draw on; iOS fills it with
     this background, so it matches Mist's tab bar and reads as part of it. */
  html, body { margin: 0; height: 100%; background: #fcfcfb; }
  @media (prefers-color-scheme: dark) { html, body { background: #1a1a19; } }
  body { font: 16px -apple-system, system-ui, sans-serif; }
  .gate { position: fixed; inset: 0; background: #c6ff00; display: grid; place-items: center; padding: 24px; overflow: auto; }
  .gate form, .gate .box { width: 100%; max-width: 340px; text-align: center; }
  .gate img { width: 96px; height: 96px; border-radius: 22px; }
  .gate h1 { margin: 16px 0 6px; font-size: 28px; color: #111; }
  .gate p { margin: 0 0 14px; color: #333; line-height: 1.4; }
  .gate a { color: #111; font-weight: 700; }
  .gate input { width: 100%; box-sizing: border-box; padding: 14px; border-radius: 14px; border: 2px solid #111; font: 700 22px ui-monospace, Menlo, monospace; letter-spacing: 3px; text-align: center; text-transform: uppercase; background: #fff; color: #111; }
  .gate button { width: 100%; margin-top: 10px; padding: 14px; border-radius: 14px; border: 0; background: #111; color: #c6ff00; font-size: 17px; font-weight: 700; }
  .gate button:disabled { opacity: .6; }
  .gate .err { min-height: 1.4em; margin: 12px 0 0; color: #7a0000; font-weight: 600; }
  .gate .steps { text-align: left; margin: 0 0 16px; padding-left: 22px; color: #333; line-height: 1.45; }
</style>
</head>

<script>
(function () {
  /* Everything here stays inside this function: Mist's own code is written into this same page later, and its
     names must not clash with the launcher's. */
  /* Mist on the Home Screen. Mist's code comes from the script (?raw=1, no data in it) and runs straight on this page,
     full screen. Every server call carries this phone's device token, which it gets once by pairing with a one-time
     code. Nothing secret is ever put in a link. */
  var APP = 'https://script.google.com/macros/s/AKfycbxJIYeWdT81BLASy43NE2pJT16FIXjJyswVVbB36AkSmkoGAgje_qk4Xk_6-c_OShA0/exec';
  var PAIR_PAGE = 'https://script.google.com/macros/s/AKfycbyCh4C_3IzApqNi9ZlywtS1qiB5YelyjvcIq4WYNlk/dev?pair=1';
  var TOKEN_KEY = 'mistDevice';
  function token() { try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; } }
  function saveToken(t) { try { localStorage.setItem(TOKEN_KEY, t); return localStorage.getItem(TOKEN_KEY) === t; } catch (e) { return false; } }
  function forget() { try { localStorage.removeItem(TOKEN_KEY); } catch (e) {} }
  /* The old shared key is retired: remove it from this phone and from the address */
  try { localStorage.removeItem('mistKey'); } catch (e) {}
  if (/k=/.test(location.hash)) { try { history.replaceState(null, '', location.pathname); } catch (e) { location.hash = ''; } }

  var unpairedNote = /unpaired/.test(location.hash);
  if (unpairedNote) { try { history.replaceState(null, '', location.pathname); } catch (e) {} }
  if (token()) run(); else pairScreen(unpairedNote ? 'This phone is no longer paired. Get a new code to pair it again.' : '');

  function send(body) {
    return fetch(APP, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), credentials: 'omit' })
      .then(function (r) { return r.json(); });
  }
  function post(name, args) {
    args = [].slice.call(args || []);
    args[0] = token();
    return send({ rpc: name, args: args }).then(function (j) {
      if (j && j.unpaired) { forget(); location.replace(location.pathname + '#unpaired'); location.reload(); }
      if (!j || !j.ok) throw new Error((j && j.error) || 'Something went wrong');
      return j.value;
    });
  }
  /* Stands in for google.script.run inside the app. The app passes its key first; it is swapped for the device token.
     The first getAll was already started while the app downloaded. */
  function shim(APP) {
    try { if (!matchMedia('(prefers-color-scheme: dark)').matches) { var sb = document.getElementById('sbs'); if (sb) sb.setAttribute('content', 'default'); } } catch (e) {}
    var first = window.__mistFirst || {};
    var send = window.__mistPost || function (name, args) {
      var t = ''; try { t = localStorage.getItem('mistDevice') || ''; } catch (e) {}
      args = [].slice.call(args || []); args[0] = t;
      return fetch(APP, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ rpc: name, args: args }), credentials: 'omit' })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (j && j.unpaired) { try { localStorage.removeItem('mistDevice'); } catch (e) {} location.replace(location.pathname + '#unpaired'); location.reload(); }
          if (!j || !j.ok) throw new Error((j && j.error) || 'Something went wrong'); return j.value;
        });
    };
    function runner(ok, fail) {
      return new Proxy({}, { get: function (_, p) {
        if (p === 'withSuccessHandler') return function (h) { return runner(h, fail); };
        if (p === 'withFailureHandler') return function (h) { return runner(ok, h); };
        if (p === 'withUserObject') return function () { return runner(ok, fail); };
        return function () {
          var args = [].slice.call(arguments), name = String(p), job;
          if (first[name] && args.length === 1) { job = first[name]; delete first[name]; } else job = send(name, args);
          job.then(function (v) { if (ok) ok(v); }, function (e) { if (fail) fail(e); });
        };
      } });
    }
    window.google = { script: { run: runner(null, null), url: { getLocation: function (cb) { cb({ parameter: {}, parameters: {}, hash: '' }); } }, host: { close: function () {}, setHeight: function () {}, setWidth: function () {} } } };
  }

  function run() {
    var done = false;
    window.__mistPost = post;
    window.__mistFirst = { getAll: post('getAll', ['']) };
    window.__mistFirst.getAll.catch(function () {});
    var slow = setTimeout(function () { if (!done) { done = true; offline(); } }, 25000);
    fetch(APP + '?raw=1', { credentials: 'omit' })
      .then(function (r) { return r.text(); })
      .then(function (html) {
        if (done) return;
        if (html.indexOf('const KEY') < 0) throw new Error('Not the app');
        done = true; clearTimeout(slow);
        /* keep this page's home-screen tags (icon, title, status bar), so Add to Home Screen still works from the app */
        var keep = [].slice.call(document.head.querySelectorAll('meta, link, title')).filter(function (el) {
          return el.getAttribute('name') !== 'viewport' && !el.hasAttribute('charset');
        }).map(function (el) { return el.outerHTML; }).join('');
        html = html.replace('<head>', '<head>' + keep + '<script>(' + shim + ')(' + JSON.stringify(APP) + ');<\/script>');
        document.open(); document.write(html); document.close();
      })
      .catch(function () { if (!done) { done = true; clearTimeout(slow); offline(); } });
  }

  function icon() { return document.querySelector('link[rel=apple-touch-icon]').href; }
  function offline() {
    document.body.innerHTML = '<div class="gate"><div class="box"><img alt=""><h1>Mist</h1>' +
      '<p>Mist can’t be reached right now. Check your internet connection and try again.</p><button id="again">Try again</button></div></div>';
    document.querySelector('.gate img').src = icon();
    document.getElementById('again').onclick = function () { location.reload(); };
  }

  function deviceName() {
    var u = navigator.userAgent || '';
    var kind = /iPhone/.test(u) ? 'iPhone' : /iPad/.test(u) ? 'iPad' : /Android/.test(u) ? 'Android phone' : /Macintosh/.test(u) ? 'Mac' : /Windows/.test(u) ? 'Windows PC' : 'Browser';
    var d = new Date();
    return kind + ' (' + d.getDate() + ' ' + ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][d.getMonth()] + ')';
  }

  function pairScreen(note) {
    document.body.innerHTML = '<div class="gate"><form id="g" autocomplete="off"><img alt=""><h1>Mist</h1>' +
      '<p>Pair this phone once to open Mist.</p>' +
      '<ol class="steps"><li>Open the <a id="pp" target="_blank" rel="noopener">pairing page</a>, signed in to Google as Mist’s owner.</li>' +
      '<li>Enter the 8-character code it shows.</li></ol>' +
      '<input id="c" inputmode="text" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="9" placeholder="ABCD 2345" aria-label="Pairing code">' +
      '<button id="go">Pair this phone</button><p class="err" id="err" role="alert"></p></form></div>';
    document.querySelector('.gate img').src = icon();
    document.getElementById('pp').href = PAIR_PAGE;
    var err = document.getElementById('err'), go = document.getElementById('go');
    err.textContent = note || '';
    document.getElementById('g').onsubmit = function (e) {
      e.preventDefault();
      var code = document.getElementById('c').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (code.length !== 8) { err.textContent = 'The code has 8 letters and numbers.'; return; }
      go.disabled = true; err.textContent = '';
      send({ pair: code, device: deviceName() })
        .then(function (j) {
          if (!j || !j.ok || !j.token) throw new Error((j && j.error) || 'That code didn’t work. Get a new one.');
          if (!saveToken(j.token)) throw new Error('This phone couldn’t save the pairing. If Private Browsing is on, turn it off and try again.');
          run();
        })
        .catch(function (x) { go.disabled = false; err.textContent = (x && x.message && !/fetch|network|load/i.test(x.message)) ? x.message : 'Mist can’t be reached right now. Check your connection and try again.'; });
    };
  }
})();
</script>
</body>
</html>
